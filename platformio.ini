[env:dfrobot_firebeetle2_esp32e]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino

lib_deps =
    zinggjm/GxEPD2@^1.6.0

; Serial port (WCH CH340 on this Mac)
upload_port = /dev/cu.wchusbserial110
monitor_port = /dev/cu.wchusbserial110
monitor_speed = 115200

; Conservative upload speed — reliable with manual BOOT/RST entry
; (macOS 26 WCH driver doesn't auto-reset via DTR/RTS)
upload_speed = 460800

; Don't attempt DTR/RTS auto-reset (broken with this driver).
; Board is placed in download mode manually before upload.
upload_flags =
    --before=no_reset
    --after=no_reset
