name: render

on:
  schedule:
    - cron: "7 * * * *"     # hourly at :07 (off the :00 spike)
  workflow_dispatch:         # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["render/**", "requirements.txt", ".github/workflows/render.yml"]

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          pip install -r requirements.txt
      - name: Render board
        run: python render/tfl.py
      - name: Commit updated image
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tfl.bin public/tfl.png
          git diff --staged --quiet || git commit -m "render: update TfL board [skip ci]"
          git push
